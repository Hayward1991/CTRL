name: Build CTRL Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct Android project structure
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/java/com/ctrl/life
          mkdir -p app/src/main/res/values

          # The phone upload flattened the project; preserve the module build file first.
          cp build.gradle.kts /tmp/app-build.gradle.kts
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv MainActivity.kt app/src/main/java/com/ctrl/life/MainActivity.kt
          mv themes.xml app/src/main/res/values/themes.xml
          cp /tmp/app-build.gradle.kts app/build.gradle.kts

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.3.1" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.21" apply false
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload CTRL APK
        uses: actions/upload-artifact@v4
        with:
          name: CTRL-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
